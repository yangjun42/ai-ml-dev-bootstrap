[project]
name = "ai-ml-starter"
version = "0.1.0"
description = "Starter AI/ML project generated by ai-ml-dev-bootstrap"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "pillow>=10",
  "opencv-python>=4.9",
  "rich>=13",
  "tqdm>=4",
  "pydantic>=2",
  "python-dotenv>=1",
  "polars>=1",
  "duckdb>=1",
]

[project.optional-dependencies]
ai = [
  "jupyterlab>=4",
  "ipykernel>=6",
  "ipywidgets>=8",
  "torch",
  "torchvision",
  "torchaudio",
  "transformers>=4",
  "datasets>=3",
  "accelerate>=1",
  "evaluate>=0.4",
  "safetensors>=0.4",
  "tokenizers>=0.20",
  "sentencepiece>=0.2",
  "peft>=0.13",
  "trl>=0.12",
  "huggingface-hub>=0.26",
  "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
mlsys = [
  "tensorboard>=2.17",
  "torch-tb-profiler>=0.4",
  "scalene>=1.5",
  "py-spy>=0.3",
  "memray>=1.14; sys_platform != 'win32'",
  "viztracer>=1",
  "line-profiler>=4",
  "pytest-benchmark>=4",
  "onnx>=1.16",
  "onnxruntime>=1.19",
  "optimum>=1.23",
]
personal = [
  "mlflow>=2.15",
  "wandb>=0.18",
  "dvc>=3",
  "dvc-s3>=3",
  "gradio>=5",
  "streamlit>=1.38",
  "marimo>=0.9",
]
restricted = [
  "mlflow>=2.15",
  "dvc>=3",
  "pip-audit>=2",
  "cyclonedx-bom>=5",
  "bandit>=1.7",
  "detect-secrets>=1.5",
  "marimo>=0.9",
]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pytest>=8",
  "pre-commit>=4",
  "ipython>=8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
