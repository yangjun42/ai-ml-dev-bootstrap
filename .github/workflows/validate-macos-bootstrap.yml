name: validate macOS bootstrap

on:
  pull_request:
    paths:
      - "brewfiles/macos/**"
      - "scripts/bootstrap-macos*.sh"
      - "scripts/verify-macos-bootstrap.sh"
      - "docs/MACOS_PROFILES.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/validate-macos-bootstrap.yml"
  push:
    branches: [main]
    paths:
      - "brewfiles/macos/**"
      - "scripts/bootstrap-macos*.sh"
      - "scripts/verify-macos-bootstrap.sh"
      - "docs/MACOS_PROFILES.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/validate-macos-bootstrap.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and profile manifests
        run: bash scripts/verify-macos-bootstrap.sh
