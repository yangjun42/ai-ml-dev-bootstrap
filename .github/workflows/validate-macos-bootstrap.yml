name: validate macOS bootstrap

on:
  pull_request:
    paths:
      - "brewfiles/macos/**"
      - "config/macos/**"
      - "scripts/bootstrap-macos*.sh"
      - "scripts/configure-macos-shell.sh"
      - "scripts/test-macos-configure.sh"
      - "scripts/verify-macos-bootstrap.sh"
      - "docs/MACOS.md"
      - "docs/ARCHITECTURE.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/validate-macos-bootstrap.yml"
  push:
    branches: [main]
    paths:
      - "brewfiles/macos/**"
      - "config/macos/**"
      - "scripts/bootstrap-macos*.sh"
      - "scripts/configure-macos-shell.sh"
      - "scripts/test-macos-configure.sh"
      - "scripts/verify-macos-bootstrap.sh"
      - "docs/MACOS.md"
      - "docs/ARCHITECTURE.md"
      - "README.md"
      - "Makefile"
      - ".github/workflows/validate-macos-bootstrap.yml"

permissions:
  contents: read

jobs:
  linux-static-and-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts, manifests, and config idempotence
        run: bash scripts/verify-macos-bootstrap.sh

  macos-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with macOS shell and filesystem semantics
        run: bash scripts/verify-macos-bootstrap.sh
